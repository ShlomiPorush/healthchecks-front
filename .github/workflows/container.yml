name: Build and publish container

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/shlomiporush/healthchecks-front

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Read package version
        id: version
        shell: bash
        run: |
          version="$(node --print "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "package.json contains an invalid release version: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=low

  container:
    name: Build container
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.verify.outputs.version }},enable=${{ steps.release.outputs.is_new }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Remove obsolete image versions
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: healthchecks-front
        shell: bash
        run: |
          set -euo pipefail

          endpoint="/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE_NAME}/versions"
          versions="$({
            gh api --paginate \
              --slurp \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${endpoint}?per_page=100"
          } | jq 'add')"

          retained_filter='def retained_tag:
            . == "latest" or
            test("^[0-9]+\\.[0-9]+\\.[0-9]+([-.][0-9A-Za-z.-]+)?$");'

          mixed_versions="$({
            jq -r "${retained_filter}
              .[]
              | (.metadata.container.tags // []) as \$tags
              | select(
                  ([\$tags[] | select(retained_tag)] | length) > 0 and
                  ([\$tags[] | select(retained_tag | not)] | length) > 0
                )
              | \"\(.id): \(\$tags | join(\", \"))\"" <<< "$versions"
          })"
          if [[ -n "$mixed_versions" ]]; then
            echo "Cannot remove obsolete tags that share a package version with retained tags:" >&2
            echo "$mixed_versions" >&2
            exit 1
          fi

          mapfile -t obsolete_versions < <(
            jq -r "${retained_filter}
              .[]
              | (.metadata.container.tags // []) as \$tags
              | select([\$tags[] | select(retained_tag)] | length == 0)
              | .id" <<< "$versions"
          )

          for version_id in "${obsolete_versions[@]}"; do
            echo "Deleting obsolete package version ${version_id}"
            gh api --method DELETE \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${endpoint}/${version_id}"
          done

      - name: Create GitHub release
        if: github.event_name != 'pull_request' && steps.release.outputs.is_new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION}" \
            --generate-notes
